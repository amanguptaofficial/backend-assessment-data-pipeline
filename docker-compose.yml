services:
  postgres:
    image: postgres:15
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-customer_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  mock-server:
    build: ./mock-server
    ports:
      - "${FLASK_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  pipeline-service:
    build: ./pipeline-service
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-server:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/customer_db}
      FLASK_API_URL: ${FLASK_API_URL:-http://mock-server:5000}
    env_file:
      - .env
